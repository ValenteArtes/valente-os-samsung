plugins {
    id 'com.android.application'
}
android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.valenteartes.samsung"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    // Sem dependencias extras — Android 7+ tem TLS 1.2 nativo no WebView
}
