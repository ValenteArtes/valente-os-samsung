}
function corPrev() {
  var c = document.getElementById('cont'), v = c.querySelector('#ce_hex').value, p = c.querySelector('#corPrev');
  if (p && /^#[0-9a-fA-F]{6}$/.test(v)) p.style.background = v;
}
function salvarCor(n) {
  var c = document.getElementById('cont');
  var hex = (c.querySelector('#ce_hex').value || '').replace(/^\s+|\s+$/g, '');
  if (hex && !/^#[0-9a-fA-F]{6}$/.test(hex)) { toast('Hex inválido. Use o formato #2e7d32.', true); return; }
  var patch = { nome: c.querySelector('#ce_nome').value || null, familia: c.querySelector('#ce_fam').value || null, hex: hex || null, prateleira: c.querySelector('#ce_prat').value || null };
  sbPatch('cores', 'numero=eq.' + n, patch, function(err) {
    if (err) { toast('Erro: ' + err.message, true); return; }
    var l = S.cores, i;
    for (i = 0; i < l.length; i++) if (l[i].numero === n) { l[i].nome = patch.nome; l[i].familia = patch.familia; l[i].hex = patch.hex; l[i].prateleira = patch.prateleira; }
    toast('Cor salva.');
    S.formBuilt = false;
    S.nav = { mod: 'cores', sub: null, lim: 15 };
    renderModalidades();
  });
}

/* Cores por parte dentro do detalhe da peça */
function carregarCoresDaPeca(id, cb) {
  sbGet('pecas_cores', 'peca_id=eq.' + id + '&order=ordem&select=id,parte,cor_numero,ordem', function(err, d) {
    S.pecaCores = (!err && d) ? d : [];
    if (S.cores && S.cores.length) { cb(); return; }
    sbGet('cores', 'select=numero,nome,familia,hex,prateleira,ativo&order=numero', function(e2, cs) { S.cores = (!e2 && cs) ? cs : []; cb(); });
  });
}
function pecaCoresHtml(pecaId) {
  var l = S.pecaCores || [], cs = S.cores || [], h = '<div class="card"><div class="card-label">🎨 Cores por parte</div>', i, j, c, k;
  if (!l.length) h += '<div class="ficha-pend">Nenhuma cor cadastrada para esta peça.</div>';
  for (i = 0; i < l.length; i++) {
    k = null;
    for (j = 0; j < cs.length; j++) if (cs[j].numero === l[i].cor_numero) k = cs[j];
    h += '<div style="display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:10px">' +
      '<div style="width:28px;height:28px;border-radius:50%;border:2px solid #475569;margin-right:10px;background:' + esc((k && k.hex) || '#1e293b') + '"></div>' +
      '<div style="-webkit-flex:1;flex:1;color:#f1f5f9">' + esc(l[i].parte) + ' → ' + corCodigo(l[i].cor_numero) + (k && k.nome ? ' · ' + esc(k.nome) : '') + '</div>' +
      '<button class="nav-back" style="margin:0" onclick="removerCorPeca(\'' + l[i].id + '\',\'' + pecaId + '\')">✕</button></div>';
  }
  var opts = '<option value="">— cor —</option>';
  for (j = 0; j < cs.length; j++) opts += '<option value="' + cs[j].numero + '">' + corCodigo(cs[j].numero) + (cs[j].nome ? ' · ' + esc(cs[j].nome) : '') + '</option>';
  h += '<div class="ficha-lbl" style="margin-top:8px">Adicionar parte</div><input class="ficha-in" id="pc_parte" type="text" placeholder="Ex.: Corpo, Detalhes, Base">' +
    '<select class="ficha-in" id="pc_cor">' + opts + '</select>' +
    '<button class="btn btn-ref" onclick="adicionarCorPeca(\'' + pecaId + '\')">➕ Adicionar cor</button></div>';
  return h;
}
function adicionarCorPeca(pecaId) {
  var c = document.getElementById('cont');
  var parte = (c.querySelector('#pc_parte').value || '').replace(/^\s+|\s+$/g, ''), cor = parseInt(c.querySelector('#pc_cor').value, 10);
  if (!parte || isNaN(cor)) { toast('Informe a parte e escolha a cor.', true); return; }
  sbPost('pecas_cores', { peca_id: pecaId, parte: parte, cor_numero: cor, ordem: (S.pecaCores || []).length }, function(err) {
    if (err) { toast('Erro: ' + err.message, true); return; }
    carregarCoresDaPeca(pecaId, function() { S.formBuilt = false; renderModalidades(); });
  });
}
function removerCorPeca(id, pecaId) {
  sbDelete('pecas_cores', 'id=eq.' + id, function(err) {
    if (err) { toast('Erro: ' + err.message, true); return; }
    carregarCoresDaPeca(pecaId, function() { S.formBuilt = false; renderModalidades(); });
  });
}


/* Descobre a peça de uma OT: direta (peca_id) ou pelo plano → OP → itens da OP.
   OP com várias peças: tenta casar o nome do componente no título da OT; se não achar, deixa escolher. */
function trNorm(t) {
  return String(t || '').toLowerCase().replace(/[áàãâä]/g, 'a').replace(/[éèêë]/g, 'e').replace(/[íìîï]/g, 'i')
    .replace(/[óòõôö]/g, 'o').replace(/[úùûü]/g, 'u').replace(/ç/g, 'c').replace(/×.*$/, '').replace(/^(pintar|pintura:|lavar|montar|embalar)\s+/, '').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
}
function resolverPecaId(cb) {
  var ot = S.ot, i;
  S.pecaViaPlano = false; S.pecaOpcoes = [];
  if (ot.peca_id) { cb(ot.peca_id); return; }
  if (!ot.plano_id) { cb(null); return; }
  var t = S.tipos[ot.tipo_ot_id];
  if (t && t.grupo === 'administrativa') { cb(null); return; }
  sbGet('planos_producao', 'id=eq.' + ot.plano_id + '&select=op_id', function(e1, pl) {
    var opId = (!e1 && pl && pl.length) ? pl[0].op_id : null;
    if (!opId) { cb(null); return; }
    sbGet('op_itens', 'op_id=eq.' + opId + '&entity_type=eq.peca&select=entity_id', function(e2, it) {
      var ids = [];
      if (!e2 && it) for (i = 0; i < it.length; i++) if (it[i].entity_id && ids.indexOf(it[i].entity_id) < 0) ids.push(it[i].entity_id);
      if (!ids.length) {
        sbGet('ordens_producao', 'id=eq.' + opId + '&select=pedido_id', function(e3, op) {
          var pid = (!e3 && op && op.length) ? op[0].pedido_id : null;
          if (!pid) { cb(null); return; }
          sbGet('pedidos', 'id=eq.' + pid + '&select=peca_propria_id', function(e4, pd) {
            var peca = (!e4 && pd && pd.length) ? pd[0].peca_propria_id : null;
            if (peca) S.pecaViaPlano = true;
            cb(peca || null);
          });
        });
        return;
      }
      S.pecaViaPlano = true;
      if (ids.length === 1) { cb(ids[0]); return; }
      var lista = ids.join(',');
      sbGet('pecas_proprias', 'id=in.(' + lista + ')&select=id,modelo,codigo_publico', function(e5, ps) {
        S.pecaOpcoes = (!e5 && ps) ? ps : [];
        sbGet('peca_componentes', 'peca_id=in.(' + lista + ')&select=peca_id,nome', function(e6, cs) {
          var alvo = trNorm(ot.titulo), achados = [], k;
          if (!e6 && cs && alvo) for (k = 0; k < cs.length; k++) {
            var nc = trNorm(cs[k].nome);
            if (nc && (alvo === nc || alvo.indexOf(nc) >= 0 || nc.indexOf(alvo) >= 0) && achados.indexOf(cs[k].peca_id) < 0) achados.push(cs[k].peca_id);
          }
          cb(achados.length === 1 ? achados[0] : null);
        });
      });
    });
  });
}
function escolherPecaOP(id) {
  sbGet('pecas_proprias', 'id=eq.' + id + '&select=id,modelo,codigo_publico,foto_base64,preco,roteiro_id', function(err, pd) {
    S.peca = (!err && pd && pd.length) ? pd[0] : null;
    S.pecaViaPlano = true;
    carregarPedidoEDetalhe();
  });
}
function trocarModeloOP() { S.peca = null; S.coresPeca = []; renderDetalhe(); }
function opcoesPecaHtml() {
  var l = S.pecaOpcoes || [], h, i;
  if (S.peca || l.length < 2) return '';
  h = '<div class="card"><div class="card-label">🖼️ Modelos desta ordem (' + l.length + ')</div><div class="ot-meta" style="margin-bottom:8px">Toque no modelo que você está pintando para ver a foto e as cores.</div>';
  for (i = 0; i < l.length; i++) {
    h += '<button class="btn btn-ref" style="margin-bottom:8px" onclick="escolherPecaOP(\'' + l[i].id + '\')">' + esc((l[i].codigo_publico ? l[i].codigo_publico + ' · ' : '') + (l[i].modelo || '')) + '</button>';
  }
  return h + '</div>';
}

function voltarInbox() {
  S.view = 'inbox';
  S.ot = null; S.tipo = null; S.peca = null;
  S.checklist = []; S.fotoOk = false;
  render();
  carregarOTs(false);
}

function sair() {
  pararTimer();
  S.view = 'pin';
  S.colaborador = null; S.pinDigits = []; S.pinErro = false;
  S.ots = []; S.ot = null; S.tipo = null; S.peca = null;
  S.checklist = []; S.fotoOk = false;
  S.semFoto = []; S.pedidosLista = []; S.ctxOk = false; S.tipos = {}; S.meusSubs = []; S.g = null;
  S.nav = { mod: null, sub: null, lim: 15 };
  render();
}
