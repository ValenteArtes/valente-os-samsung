<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Valente OS — Terminal</title>
<style>
* { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #0f172a;
  color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}

#app {
  width: 100%; height: 100%;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
  overflow: hidden;
}

/* ─── HEADER ─── */
.header {
  background: #1e293b;
  padding: 10px 16px;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
  border-bottom: 1px solid #334155;
  -webkit-flex-shrink: 0; flex-shrink: 0;
}
.header-logo { font-weight: 700; font-size: 1rem; color: #f97316; }
.header-user { font-size: 0.8rem; color: #94a3b8; }
.header-btn {
  background: transparent; border: 1px solid #475569;
  color: #94a3b8; padding: 6px 14px; border-radius: 6px;
  font-size: 0.8rem; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.header-btn:active { background: #334155; }

/* ─── CENTRO DE CAPACITAÇÃO (prefixo trein-, nunca colide com o resto) ─── */
.trein-identificacao, .trein-inicio, .trein-aula { max-width: 640px; margin: 0 auto; }
.trein-header {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
  -webkit-box-align: flex-start; -webkit-align-items: flex-start; align-items: flex-start;
  gap: 12px; margin-bottom: 14px;
}
.trein-titulo-principal { font-size: 1.1rem; font-weight: 700; color: #f97316; }
.trein-logo { font-weight: 700; color: #f97316; margin-bottom: 8px; }
.hint { color: #94a3b8; font-size: 0.82rem; }
.trein-progresso-wrap { margin: 12px 0 18px; }
.trein-progresso-label { font-size: 0.85rem; margin-bottom: 6px; }
.trein-progresso-barra { height: 12px; background: #1e293b; border-radius: 999px; overflow: hidden; }
.trein-progresso-fill { height: 100%; background: #f97316; }
.trein-cards-grid {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: 12px;
}
.trein-card {
  background: #1e293b; border: 1px solid #334155; border-radius: 10px;
  padding: 12px; cursor: pointer; min-height: 100px; width: 46%;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; gap: 4px;
}
.trein-card:active { background: #334155; }
.trein-card--bloqueado { opacity: 0.5; }
.trein-card--concluido { border-color: #22c55e; }
.trein-card--em_andamento { border-color: #f97316; }
.trein-card-topo {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
}
.trein-card-dia { font-size: 0.75rem; font-weight: 700; color: #f97316; text-transform: uppercase; }
.trein-card-titulo { font-weight: 600; font-size: 0.95rem; }
.trein-card-sub { font-size: 0.8rem; color: #94a3b8; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
.trein-card-label { font-size: 0.75rem; color: #64748b; }
.trein-placeholder { background: #1e293b; border: 1px dashed #334155; border-radius: 10px; padding: 16px; margin: 14px 0; }
.trein-concluido-msg { color: #22c55e; font-weight: 700; }
.trein-pergunta-enunciado { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
.trein-opcoes {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; gap: 8px;
}
.trein-opcao-btn {
  text-align: left; font-size: 0.95rem; padding: 12px 14px; border-radius: 8px;
  border: 1px solid #334155; background: #1e293b; color: #e2e8f0; cursor: pointer; min-height: 44px;
}
.trein-opcao-btn:active { background: #334155; }
.trein-feedback { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 0.88rem; }
.trein-feedback--ok { background: #052e16; color: #22c55e; border: 1px solid #22c55e; }
.trein-feedback--erro { background: #1a0a0a; color: #ef4444; border: 1px solid #ef4444; }
.trein-balao-cliente { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.trein-balao-tag { display: block; font-size: 0.65rem; font-weight: 700; color: #f97316; margin-bottom: 4px; }
.trein-check-item {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  gap: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; min-height: 44px;
}
.trein-check-item input[type="checkbox"] { width: 18px; height: 18px; }
.trein-ordenar-escolhidos ol { margin: 0 0 12px; padding-left: 20px; }
.trein-ordenar-acoes { display: -webkit-box; display: -webkit-flex; display: flex; gap: 10px; margin-top: 10px; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
.trein-etapa-missao { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; }
.trein-missao-titulo { font-weight: 700; color: #f97316; margin-bottom: 8px; }
.trein-etapa-missao ul { margin: 4px 0 10px; padding-left: 18px; }
.trein-missao-anotacao { margin-bottom: 10px; }
.trein-textarea {
  width: 100%; box-sizing: border-box; font: inherit; padding: 10px; border-radius: 8px;
  border: 1px solid #334155; background: #0f172a; color: #e2e8f0; resize: vertical; margin-bottom: 10px;
}
.trein-resultado-competencias, .trein-resultado-resumo {
  background: #1e293b; border: 1px solid #334155; border-radius: 10px; margin: 12px 0; overflow: hidden;
}
.trein-resultado-linha {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
  padding: 10px 12px; border-bottom: 1px solid #334155; font-size: 0.88rem;
}
.trein-resultado-linha:last-child { border-bottom: none; }
.trein-resultado-classificacao { text-align: center; font-weight: 700; padding: 14px; border-radius: 10px; margin: 12px 0; }
.trein-resultado-classificacao--liberado { background: #052e16; color: #22c55e; border: 1px solid #22c55e; }
.trein-resultado-classificacao--funcional_supervisao { background: #2e2608; color: #eab308; border: 1px solid #eab308; }
.trein-resultado-classificacao--precisa_acompanhamento { background: #1a0a0a; color: #ef4444; border: 1px solid #ef4444; }
.trein-acoes-trilha-concluida { display: -webkit-box; display: -webkit-flex; display: flex; gap: 10px; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: 4px 0 16px; }
.btn-icon, .btn-primary {
  padding: 10px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0;
  font-size: 0.9rem; cursor: pointer; margin: 4px 4px 4px 0; -webkit-tap-highlight-color: transparent;
}
.btn-primary { background: #f97316; color: #0f172a; border-color: #f97316; font-weight: 700; }
.btn-primary[disabled] { opacity: 0.5; }

/* ─── CONTENT ─── */
.content {
  -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
  overflow-y: auto; overflow-x: hidden;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
}

/* ─── PIN SCREEN ─── */
.pin-screen {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
  height: 100%;
  gap: 20px;
}
.pin-logo { font-size: 2rem; font-weight: 800; color: #f97316; letter-spacing: -0.5px; }
.pin-subtitle { color: #64748b; font-size: 0.85rem; }

.pin-display {
  display: -webkit-box; display: -webkit-flex; display: flex;
  gap: 14px; -webkit-box-align: center; -webkit-align-items: center; align-items: center;
}
.pin-dot {
  width: 22px; height: 22px; border-radius: 50%;
  background: #1e293b; border: 2px solid #475569;
}
.pin-dot.on { background: #f97316; border-color: #f97316; }
.pin-error { color: #f87171; font-size: 0.82rem; min-height: 18px; text-align: center; }

.pin-pad {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-flex-wrap: wrap; flex-wrap: wrap;
  width: 264px; gap: 10px;
}
.pin-btn {
  width: 78px; height: 72px;
  background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
  font-size: 1.5rem; font-weight: 600; border-radius: 14px;
  cursor: pointer; text-align: center;
  -webkit-tap-highlight-color: rgba(249,115,22,0.15);
  -webkit-appearance: none;
}
.pin-btn:active { background: #334155; }
.pin-btn.del { font-size: 1.1rem; color: #94a3b8; }
.pin-btn.vazio { background: transparent; border-color: transparent; cursor: default; }

/* ─── CARDS / INBOX ─── */
.secao-label {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.09em; color: #475569; margin: 18px 0 8px;
}
.secao-label:first-child { margin-top: 0; }

.ot-card {
  background: #1e293b; border: 1px solid #334155; border-radius: 12px;
  padding: 14px; margin-bottom: 10px; cursor: pointer;
  -webkit-tap-highlight-color: rgba(249,115,22,0.1);
}
.ot-card:active { border-color: #f97316; background: #162032; }

.ot-row {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: flex-start; -webkit-align-items: flex-start; align-items: flex-start;
  gap: 12px;
}
.ot-icone { font-size: 1.4rem; -webkit-flex-shrink: 0; flex-shrink: 0; margin-top: 2px; }
.ot-titulo { font-weight: 600; font-size: 0.98rem; color: #f1f5f9; }
.ot-meta { font-size: 0.78rem; color: #64748b; margin-top: 3px; }

.badge {
  display: inline-block; padding: 2px 9px; border-radius: 20px;
  font-size: 0.68rem; font-weight: 700; margin-top: 6px;
}
.b-pend  { background: #1e3a5f; color: #93c5fd; }
.b-exec  { background: #14532d; color: #86efac; }
.b-paus  { background: #431407; color: #fdba74; }
.b-bloq  { background: #1c1917; color: #78716c; }
.b-conc  { background: #052e16; color: #4ade80; }


/* ─── MODALIDADES ─── */
.tile{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-tap-highlight-color:rgba(249,115,22,0.1)}
.tile:active{border-color:#f97316;background:#162032}
.tile-ico{font-size:1.6rem;margin-right:14px}
.tile-txt{-webkit-flex:1;flex:1}
.tile-tit{font-weight:700;font-size:1.02rem;color:#f1f5f9}
.tile-sub{font-size:0.76rem;color:#64748b;margin-top:2px}
.tile-ct{min-width:30px;text-align:center;font-weight:700;font-size:0.9rem;padding:4px 10px;border-radius:20px;background:#1e3a5f;color:#93c5fd}
.tile-ct.zero{background:#1e293b;color:#475569}
.nav-back{display:inline-block;background:transparent;border:1px solid #334155;color:#cbd5e1;border-radius:10px;padding:8px 14px;font-size:0.85rem;margin-bottom:12px;cursor:pointer}
.nav-tit{font-size:1.1rem;font-weight:700;color:#f1f5f9;margin-bottom:12px}
.mais-btn{display:block;width:100%;background:#1e293b;border:1px dashed #334155;color:#94a3b8;border-radius:10px;padding:12px;font-size:0.88rem;margin-bottom:10px}

.aviso-sf{font-size:0.8rem;color:#94a3b8;margin:14px 2px 0}
.aviso-sf a{color:#fb923c;text-decoration:underline}
.ficha-in{width:100%;box-sizing:border-box;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#f1f5f9;font-size:1rem;padding:12px;margin-bottom:12px}
.ficha-ok{color:#4ade80;font-size:0.9rem;margin-bottom:12px}
.ficha-pend{color:#fdba74;font-size:0.9rem;margin-bottom:12px}
.ficha-lbl{font-size:0.78rem;color:#94a3b8;margin-bottom:4px}

.trein-aviso-seq{background:#1e293b;border:1px solid #475569;border-left:4px solid #f97316;color:#e2e8f0;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:0.85rem;line-height:1.4}

/* ─── EMPTY STATE ─── */
.vazio {
  text-align: center; padding: 60px 20px 40px;
  color: #475569;
}
.vazio-ico { font-size: 3rem; margin-bottom: 12px; }
.vazio-titulo { font-size: 1.05rem; font-weight: 600; margin-bottom: 8px; color: #64748b; }
.vazio-sub { font-size: 0.82rem; }

/* ─── DETALHE ─── */
.det-header {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: flex-start; -webkit-align-items: flex-start; align-items: flex-start;
  gap: 12px; margin-bottom: 16px;
}
.det-icone { font-size: 2rem; -webkit-flex-shrink: 0; flex-shrink: 0; }
.det-titulo { font-size: 1.15rem; font-weight: 700; color: #f1f5f9; line-height: 1.3; }
.det-codigo { font-size: 0.78rem; color: #64748b; margin-top: 4px; }

.card {
  background: #1e293b; border: 1px solid #334155; border-radius: 12px;
  padding: 14px; margin-bottom: 12px;
}
.card-label {
  font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: #64748b; margin-bottom: 8px;
}
.qtd-num {
  font-size: 2.6rem; font-weight: 800; color: #f97316;
  display: inline-block; line-height: 1;
}
.qtd-unit { font-size: 0.85rem; color: #64748b; margin-left: 6px; }
.qtd-sub { margin-top: 6px; font-size: 0.8rem; color: #64748b; }

.instrucoes {
  font-size: 0.88rem; color: #cbd5e1; line-height: 1.65;
  white-space: pre-wrap; word-break: break-word;
}

.foto-img {
  width: 100%; border-radius: 10px;
  display: block; margin-top: 6px;
}
.foto-check {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: flex-start; -webkit-align-items: flex-start; align-items: flex-start;
  gap: 10px; margin-top: 10px;
}
.foto-check input[type=checkbox] {
  width: 22px; height: 22px; margin-top: 1px; -webkit-flex-shrink: 0; flex-shrink: 0;
}
.foto-check label { font-size: 0.82rem; color: #94a3b8; cursor: pointer; }

.check-item {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: flex-start; -webkit-align-items: flex-start; align-items: flex-start;
  gap: 12px; padding: 11px 10px; border-radius: 8px;
  cursor: pointer; margin-bottom: 6px; background: #0f172a;
  -webkit-tap-highlight-color: transparent;
}
.check-item.ok { background: #042f14; }
.check-box {
  width: 26px; height: 26px; border-radius: 6px; border: 2px solid #475569;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
  -webkit-flex-shrink: 0; flex-shrink: 0;
  font-size: 15px; font-weight: 700; color: white;
}
.check-item.ok .check-box { background: #16a34a; border-color: #16a34a; }
.check-txt { font-size: 0.88rem; color: #cbd5e1; padding-top: 3px; line-height: 1.4; }
.check-item.ok .check-txt { color: #475569; text-decoration: line-through; }
.check-obrig { color: #f87171; }

/* ─── BOTÕES AÇÃO ─── */
.acoes { padding: 4px 0 20px; }
.btn {
  display: block; width: 100%; padding: 17px 16px;
  border-radius: 12px; border: none;
  font-size: 1.05rem; font-weight: 700; cursor: pointer;
  margin-bottom: 10px; text-align: center;
  -webkit-tap-highlight-color: rgba(0,0,0,0.15);
  -webkit-appearance: none;
}
.btn:active { opacity: 0.72; }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn-ini  { background: #16a34a; color: #fff; }
.btn-conc { background: #2563eb; color: #fff; }
.btn-paus { background: #d97706; color: #fff; }
.btn-ret  { background: #7c3aed; color: #fff; }
.btn-vol  { background: transparent; border: 1px solid #334155; color: #94a3b8; }
.btn-ref  { background: #1e293b; border: 1px solid #334155; color: #94a3b8; }

/* ─── LOADING ─── */
.loading {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
  height: 180px; gap: 14px; color: #475569; font-size: 0.88rem;
}
.spin {
  width: 32px; height: 32px;
  border: 3px solid #334155; border-top-color: #f97316; border-radius: 50%;
  -webkit-animation: giro 0.8s linear infinite;
  animation: giro 0.8s linear infinite;
}
@-webkit-keyframes giro { to { -webkit-transform: rotate(360deg); } }
@keyframes giro { to { transform: rotate(360deg); } }

/* ─── TOAST ─── */
#toast {
  position: fixed; bottom: 18px; left: 50%;
  -webkit-transform: translateX(-50%); transform: translateX(-50%);
  background: #1e293b; border: 1px solid #475569;
  color: #e2e8f0; padding: 9px 20px; border-radius: 8px;
  font-size: 0.88rem; z-index: 999;
  opacity: 0; pointer-events: none;
  white-space: nowrap;
  -webkit-transition: opacity 0.25s; transition: opacity 0.25s;
  max-width: 90%;
}
#toast.show { opacity: 1; }
#toast.err  { border-color: #f87171; color: #fca5a5; }

/* ─── AUTO-REFRESH BAR ─── */
.refresh-bar {
  font-size: 0.72rem; color: #475569; text-align: center;
  padding: 6px 0 0; margin-top: -4px;
}
</style>
</head>

───────────────────────────────────────── */
function xhr(method, table, qs, body, cb) {
  var url = SUPABASE_URL + '/rest/v1/' + table + (qs ? '?' + qs : '');

  /* ── Bridge nativa: resolve TLS 1.2 no Android 4.x ── */
  if (window.NativeBridge) {
    var cbId = 'cb' + Date.now() + Math.floor(Math.random()*9999);
    window['__nb_' + cbId] = function(httpStatus, responseText) {
      var ok = httpStatus >= 200 && httpStatus < 300;
      var data = null;
      try { if (responseText) data = JSON.parse(responseText); } catch(e) {}
      if (ok) {
        cb(null, data);
      } else {
        var msg = httpStatus === 0 ? 'Sem conexão' : ('Erro HTTP ' + httpStatus);
        if (data && data.message) msg = data.message;
        cb(new Error(msg), null);
      }
    };
    NativeBridge.request(
      method, url, SUPABASE_KEY,
      body !== null ? JSON.stringify(body) : '',
      cbId
    );
    return;
  }

  /* ── Fallback: XMLHttpRequest padrão ── */
  var req = new XMLHttpRequest();
  req.open(method, url, true);
  req.setRequestHeader('apikey', SUPABASE_KEY);
  req.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
  req.setRequestHeader('Accept', 'application/json');
  if (body !== null) {
    req.setRequestHeader('Content-Type', 'application/json');
    req.setRequestHeader('Prefer', 'return=minimal');
  }
  req.onreadystatechange = function() {
    if (req.readyState !== 4) return;
    var ok = req.status >= 200 && req.status < 300;
    var data = null;
    try { if (req.responseText) data = JSON.parse(req.responseText); } catch(e) {}
    if (ok) {
      cb(null, data);
    } else {
      var msg = 'Erro HTTP ' + req.status;
      if (data && data.message) msg = data.message;
      cb(new Error(msg), null);
    }
  };
  req.onerror = function() { cb(new Error('Sem conexão'), null); };
  req.send(body !== null ? JSON.stringify(body) : null);
}

function sbGet(t, qs, cb)      { xhr('GET',   t, qs, null, cb); }
function sbPatch(t, qs, b, cb) { xhr('PATCH', t, qs, b,    cb); }
function sbPost(t, b, cb)      { xhr('POST',  t, null, b,  cb); }

/* ─────────────────────────────────────────
   UTILITÁRIOS
───────────────────────────────────────── */
var STATUS_LABEL = {
  pendente: 'Pendente', aceita: 'Aceita',
  iniciada: 'Em execução', em_andamento: 'Em andamento', retomada: 'Retomada',
  pausada: 'Pausada', bloqueada: 'Bloqueada', desbloqueada: 'Desbloqueada',
  concluida: 'Concluída', cancelada: 'Cancelada'
};

function statusBadge(s) {
  var c = 'b-pend';
  if (s === 'iniciada' || s === 'em_andamento' || s === 'retomada') c = 'b-exec';
  else if (s === 'pausada') c = 'b-paus';
  else if (s === 'bloqueada' || s === 'desbloqueada') c = 'b-bloq';
  else if (s === 'concluida') c = 'b-conc';
  return '<span class="badge ' + c + '">' + (STATUS_LABEL[s] || s) + '</span>';
}

function isExec(s) { return s === 'iniciada' || s === 'em_andamento' || s === 'retomada'; }
function isPend(s) { return s === 'pendente' || s === 'aceita'; }

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

var _toastT = null;
function toast(msg, err) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (err ? ' err' : '');
  if (_toastT) clearTimeout(_toastT);
  _toastT = setTimeout(function() { el.className = ''; }, (msg && msg.length > 60) ? 5500 : 2600);
}

/* ─────────────────────────────────────────
   AUTO-REFRESH (contador regressivo)
───────────────────────────────────────── */
function pararTimer() {
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
}

function iniciarTimer() {
  pararTimer();
  S.timerSecs = 60;
  S.timer = setInterval(function() {
    S.timerSecs--;
    var bar = document.getElementById('refreshBar');
    if (bar) bar.textContent = 'Atualiza em ' + S.timerSecs + 's';
    if (S.timerSecs <= 0) {
      S.timerSecs = 60;
      if (S.view === 'inbox') carregarOTs(true);
    }
  }, 1000);
}

/* ─────────────────────────────────────────
   RENDER PRINCIPAL
───────────────────────────────────────── */
function render() {
  var app = document.getElementById('app');
  if (S.view === 'pin') {
    renderPin(app);
    return;
  }
  var nome = S.colaborador ? S.colaborador.nome.split(' ')[0] : '';
  var header = '<div class="header">' +
    '<div class="header-logo">⚙️ Valente OS</div>' +
    '<div class="header-user">👤 ' + esc(nome) + '</div>' +
    '<button class="header-btn" onclick="abrirTreinamento()">🎓 Capacitação</button>' +
    '<button class="header-btn" onclick="sair()">Sair</button>' +
    '</div>';
  app.innerHTML = header + '<div class="content" id="cont"></div>';
  if (S.view === 'inbox') renderInbox();
  else if (S.view === 'detalhe') renderDetalhe();
}

/* ─────────────────────────────────────────
   CENTRO DE CAPACITAÇÃO (treino-engine-es5.js)
───────────────────────────────────────── */
function abrirTreinamento() {
  if (typeof TreinoAbrir !== 'function') { toast('Treinamento indisponível neste terminal.', true); return; }
  TreinoAbrir(S.colaborador, function() {
    /* ao fechar, volta pra tela em que estava (inbox por padrão) */
    render();
  });
}

/* ─────────────────────────────────────────
   VIEW: PIN
───────────────────────────────────────── */
function renderPin(app) {
  var dots = '';
  for (var i = 0; i < 4; i++) {
    dots += '<div class="pin-dot' + (i < S.pinDigits.length ? ' on' : '') + '"></div>';
  }
  app.innerHTML =
    '<div class="pin-screen">' +
    '<div class="pin-logo">🏭 Valente OS</div>' +
    '<div class="pin-subtitle">Terminal do Colaborador</div>' +
    '<div class="pin-display">' + dots + '</div>' +
    '<div class="pin-error">' + (S.pinErro ? (S.pinErroMsg || 'PIN incorreto.') : '&nbsp;') + '</div>' +
    '<div class="pin-pad">' +
    '<button class="pin-btn" onclick="dPin(1)">1</button>' +
    '<button class="pin-btn" onclick="dPin(2)">2</button>' +
    '<button class="pin-btn" onclick="dPin(3)">3</button>' +
    '<button class="pin-btn" onclick="dPin(4)">4</button>' +
    '<button class="pin-btn" onclick="dPin(5)">5</button>' +
    '<button class="pin-btn" onclick="dPin(6)">6</button>' +
    '<button class="pin-btn" onclick="dPin(7)">7</button>' +
    '<button class="pin-btn" onclick="dPin(8)">8</button>' +
    '<button class="pin-btn" onclick="dPin(9)">9</button>' +
    '<button class="pin-btn vazio"></button>' +
    '<button class="pin-btn" onclick="dPin(0)">0</button>' +
    '<button class="pin-btn del" onclick="delPin()">⌫</button>' +
    '</div></div>';
}

function dPin(n) {
  if (S.pinDigits.length >= 4) return;
  S.pinDigits.push(n);
  S.pinErro = false;
  if (S.pinDigits.length === 4) {
    var pin = S.pinDigits.join('');
    renderPin(document.getElementById('app')); /* mostra 4 pontos preenchidos */
    autenticar(pin);
  } else {
    renderPin(document.getElementById('app'));
  }
}

function delPin() {
  S.pinDigits.pop();
  S.pinErro = false;
  renderPin(document.getElementById('app'));
}

function autenticar(pin) {
  sbGet('funcionarios',
    'pin=eq.' + encodeURIComponent(pin) + '&select=id,nome,cargo,estacao_padrao_id',
    function(err, data) {
      if (err || !data || !data.length) {
        S.pinDigits = [];
        S.pinErro = true;
        S.pinErroMsg = err ? ('Erro: ' + err.message) : 'PIN incorreto.';
        renderPin(document.getElementById('app'));
        return;
      }
      S.colaborador = data[0];
      S.pinDigits = []; S.pinErro = false;
      S.view = 'inbox';
      render();
      carregarOTs(false);
    }
  );
}

/* ─────────────────────────────────────────
   VIEW: INBOX (lista de OTs)
───────────────────────────────────────── */
function renderInbox() {
  var cont = document.getElementById('cont');
  if (!cont) return;
  cont.innerHTML = '<div class="loading"><div class="spin"></div>Carregando tarefas…</div>';
}

function carregarOTs(silencioso) {
  if (!S.ctxOk) { prepararContexto(function() { carregarOTs(silencioso); }); return; }
  var cont = document.getElementById('cont');
  if (!silencioso && cont) {
    cont.innerHTML = '<div class="loading"><div class="spin"></div>Carregando tarefas…</div>';
  }

  var params =
    'status=not.in.' + encodeURIComponent('(concluida,cancelada)') +
    '&select=id,codigo_publico,titulo,status,quantidade,tipo_ot_id,' +
    'responsavel_id,quantidade_concluida,ordem_execucao,disponivel_em' +
    '&order=ordem_execucao';

  sbGet('ordens_trabalho', params, function(err, data) {
    cont = document.getElementById('cont');
    if (!cont) return;

    if (err) {
      cont.innerHTML =
        '<div class="vazio"><div class="vazio-ico">⚠️</div>' +
        '<div class="vazio-titulo">Sem conexão</div>' +
        '<div class="vazio-sub">' + esc(err.message) + '</div></div>' +
        '<button class="btn btn-ref" onclick="carregarOTs(false)" style="margin-top:12px">🔄 Tentar novamente</button>';
      return;
    }

    var ots = data || [];
    S.ots = ots;
    var colabId = S.colaborador ? S.colaborador.id : null;

    var exec = [], paus = [], prod = [], disp = [];
    for (var i = 0; i < ots.length; i++) {
      var o = ots[i];
      if (o.disponivel_em && new Date(o.disponivel_em).getTime() > new Date().getTime()) continue;
      if (isExec(o.status) && o.responsavel_id === colabId) {
        exec.push(o);
      } else if (o.status === 'pausada' && o.responsavel_id === colabId) {
        paus.push(o);
      } else if (isPend(o.status) || (o.status === 'pausada' && !o.responsavel_id)) {
        var tp = S.tipos[o.tipo_ot_id];
        if (tp && BAIXA_URGENCIA.indexOf(tp.codigo) >= 0) disp.push(o); else prod.push(o);
      }
    }
    S.g = { exec: exec, paus: paus, prod: prod, disp: disp };
    S.autoRender = true; renderModalidades(); S.autoRender = false;
    iniciarTimer();
    carregarSemFoto(function() { if (S.view === 'inbox') renderModalidades(); });
    if (EXTRAS) carregarPedidosLista(function() { if (S.view === 'inbox') renderModalidades(); });
  });
}

/* ─────────────────────────────────────────
   MODALIDADES / SUBMODALIDADES
   Home: Em execução + Minha estação / Tarefas disponíveis / Outras estações.
   Dentro de cada modalidade: submodalidades por tipo de OT → lista.
───────────────────────────────────────── */
/* Tipos de baixa urgência = modalidade 'Tarefas disponíveis' (editável aqui) */
var BAIXA_URGENCIA = ['completar_ficha','providenciar_insumo','manutencao','manutencao_equipamento'];
/* Cargo → subsetor, usado quando o funcionário não tem estacao_padrao_id */
var CARGO_SUBSETOR = { comercial: 'Atendimento' };
var ICONES_TIPO = {
  completar_ficha:'📝', cobranca:'💰', contato_cliente:'📞', confirmacao_pagamento:'✅',
  aprovacao_arte:'🖼️', aprovacao_orcamento:'🧾', manutencao:'🔧', manutencao_equipamento:'🔧',
  providenciar_insumo:'🛒', impressao:'🖨️', pintura:'🎨', modelagem:'🗿', escultura:'🗿',
  lavagem:'🧪', cura:'🧪', montagem:'🔧', conferencia:'✅', separacao:'📋',
  embalagem:'📦', expedicao:'🚚'
};
function tipoDe(ot) { return S.tipos[ot.tipo_ot_id] || { codigo: 'outros', nome: 'Outras tarefas', grupo: 'fisica', subsetor_id: null }; }
function icoTipo(t) { return ICONES_TIPO[t.codigo] || '📋'; }

function ehMinha(ot) {
  if (!S.meusSubs || !S.meusSubs.length) return true;
  return S.meusSubs.indexOf(tipoDe(ot).subsetor_id) >= 0;
}

function listaDaModalidade(mod) {
  var g = S.g || { prod: [], disp: [] }, r = [], i;
  if (mod === 'disp') return g.disp;
  for (i = 0; i < g.prod.length; i++) {
    var m = ehMinha(g.prod[i]);
    if ((mod === 'prod' && m) || (mod === 'outras' && !m)) r.push(g.prod[i]);
  }
  return r;
}

function cardModHtml(ot) {
  var conc = ot.quantidade_concluida || 0, total = ot.quantidade || 0;
  var t = tipoDe(ot);
  var meta = (conc > 0 ? conc + '/' + total + ' · ' : '') + (ot.codigo_publico || '');
  return '<div class="ot-card" onclick="abrirDetalhe(\'' + ot.id + '\')">' +
    '<div class="ot-row"><div class="ot-icone">' + icoTipo(t) + '</div>' +
    '<div style="flex:1;-webkit-flex:1"><div class="ot-titulo">' + esc(ot.titulo || 'Sem título') + '</div>' +
    '<div class="ot-meta">' + esc(t.nome) + ' · ' + esc(meta) + '</div>' + statusBadge(ot.status) +
    '</div></div></div>';
}

function tileHtml(ico, tit, sub, n, acao) {
  return '<div class="tile" onclick="' + acao + '"><div class="tile-ico">' + ico + '</div>' +
    '<div class="tile-txt"><div class="tile-tit">' + esc(tit) + '</div>' +
    (sub ? '<div class="tile-sub">' + esc(sub) + '</div>' : '') + '</div>' +
    '<div class="tile-ct' + (n ? '' : ' zero') + '">' + n + '</div></div>';
}

function navIr(mod, sub) { S.formBuilt = false; S.nav = { mod: mod, sub: sub || null, lim: 15 }; renderModalidades(); window.scrollTo(0, 0); }
function navMais() { S.nav.lim += 15; renderModalidades(); }
function navVoltar() {
  var m = S.nav.mod; S.formBuilt = false;
  if (m === 'com_t') { S.nav = { mod: 'com', sub: null, lim: 15 }; renderModalidades(); window.scrollTo(0, 0); return; }
  if (m === 'cores' && !S.nav.sub && !podeComercial()) { S.nav = { mod: null, sub: null, lim: 15 }; renderModalidades(); window.scrollTo(0, 0); return; }
  if (m === 'caixa' || m === 'orcs' || m === 'conf' || m === 'novoped' || (m === 'cores' && !S.nav.sub) || ((m === 'pedidos' || m === 'pecas') && !S.nav.sub)) { S.nav = { mod: 'com', sub: null, lim: 15 }; renderModalidades(); window.scrollTo(0, 0); return; }
  if (S.nav.sub) S.nav = { mod: S.nav.mod, sub: null, lim: 15 };
  else S.nav = { mod: null, sub: null, lim: 15 };
  renderModalidades(); window.scrollTo(0, 0);
}


/* Fichas (peças) sem foto: aviso na home e lista clicável */
function carregarSemFoto(cb) {
  sbGet('pecas_proprias', 'or=(foto_base64.is.null,foto_base64.eq.)&select=id,modelo,codigo_publico,preco,roteiro_id&order=codigo_publico', function(err, d) {
    if (!err && d) S.semFoto = d;
    if (cb) cb();
  });
}
function avisoSemFotoHtml() {
  var n = (S.semFoto || []).length;
  if (!n) return '';
  return '<div class="aviso-sf">ℹ️ Existem ' + n + ' fichas sem foto no sistema. ' +
    '<a href="#" onclick="navIr(\'semfoto\');return false;">Ver fichas</a></div>';
}
function listaSemFotoHtml() {
  var l = S.semFoto || [], h = '', j, p, st;
  h += '<div class="nav-tit">Fichas sem foto (' + l.length + ')</div>';
  h += '<div class="ot-meta" style="margin-bottom:10px">Carregue as fotos pelo computador ou celular.</div>';
  for (j = 0; j < l.length; j++) {
    p = l[j];
    st = ((p.preco > 0) ? '' : 'sem preço') + ((p.preco > 0 || p.roteiro_id) ? '' : ' · ') + (p.roteiro_id ? '' : 'sem roteiro');
    h += '<div class="ot-card" style="cursor:default"><div class="ot-row"><div class="ot-icone">🖼️</div><div style="flex:1;-webkit-flex:1">' +
      '<div class="ot-titulo">' + esc(p.modelo || 'Sem nome') + '</div>' +
      '<div class="ot-meta">' + esc(p.codigo_publico || '') + (st ? ' · ' + esc(st) : '') + '</div></div></div></div>';
  }
  return h;
}

function renderModalidades() {
  var cont = document.getElementById('cont');
  if (!cont || !S.g) return;
  var nav = S.nav || (S.nav = { mod: null, sub: null, lim: 15 });
  /* formulários abertos não são redesenhados pela atualização automática (perderiam o que foi digitado) */
  if (S.autoRender && nav.mod === 'pecas' && nav.sub) return;
  if ((nav.mod === 'novoped' || nav.mod === 'conf' || (nav.mod === 'cores' && nav.sub)) && S.formBuilt) return;
  S.formBuilt = false;
  var g = S.g, html = '', j;
  var nProd = listaDaModalidade('prod').length;
  var nOutras = listaDaModalidade('outras').length;

  if (!nav.mod) {
    if (!g.exec.length && !g.paus.length && !nProd && !g.disp.length && !nOutras) {
      html = '<div class="vazio"><div class="vazio-ico">☀️</div>' +
        '<div class="vazio-titulo">Sem tarefas no momento</div>' +
        '<div class="vazio-sub">Aguarde novas ordens ou avise o supervisor.</div></div>';
    } else {
      if (g.exec.length) {
        html += '<div class="secao-label">🔧 Em execução</div>';
        for (j = 0; j < g.exec.length; j++) html += cardModHtml(g.exec[j]);
      }
      if (g.paus.length) {
        html += '<div class="secao-label">⏸ Pausadas</div>';
        for (j = 0; j < g.paus.length; j++) html += cardModHtml(g.paus[j]);
      }
      html += '<div class="secao-label">Modalidades</div>';
      html += tileHtml('🏭', (S.meusSubs && S.meusSubs.length) ? 'Minhas funções' : 'Produção',
                       'Tarefas da sua função', nProd, "navIr('prod')");
      html += tileHtml('📋', 'Tarefas disponíveis', 'Baixa urgência: completar fichas, insumos, manutenção', g.disp.length, "navIr('disp')");
      if (EXTRAS && podeComercial()) html += tileHtml('💼', 'Comercial', 'Tarefas e ferramentas: pedidos, peças, caixa, conferências', '', "navIr('com')");
      if (EXTRAS) html += tileHtml('🎨', 'Cores', 'Cor 01 a Cor 33: nome, tom e prateleira', '', "navCores()");
      if (S.meusSubs && S.meusSubs.length && nOutras) {
        html += tileHtml('🔎', 'Outras funções', 'Tarefas de outras funções (ajuda)', nOutras, "navIr('outras')");
      }
    }
  } else if (EXTRAS && comNavHtml(nav)) {
    html += comNavHtml(nav);
  } else if (nav.mod === 'semfoto') {
    html += '<button class="nav-back" onclick="navVoltar()">← Voltar</button>' + listaSemFotoHtml();
  } else {
    var lista = listaDaModalidade(nav.mod);
    var titulos = { prod: (S.meusSubs && S.meusSubs.length) ? 'Minhas funções' : 'Produção',
                    disp: 'Tarefas disponíveis', outras: 'Outras funções' };
    html += '<button class="nav-back" onclick="navVoltar()">← Voltar</button>';
    if (!nav.sub) {
      html += '<div class="nav-tit">' + esc(titulos[nav.mod]) + '</div>';
      var grp = {}, ordem = [], k;
      for (j = 0; j < lista.length; j++) {
        var t = tipoDe(lista[j]); k = t.codigo;
        if (!grp[k]) { grp[k] = { t: t, n: 0 }; ordem.push(k); }
        grp[k].n++;
      }
      ordem.sort(function(a, b) { return grp[b].n - grp[a].n; });
      if (!ordem.length) html += '<div class="vazio"><div class="vazio-titulo">Nada por aqui</div></div>';
      for (j = 0; j < ordem.length; j++) {
        html += tileHtml(icoTipo(grp[ordem[j]].t), grp[ordem[j]].t.nome, '', grp[ordem[j]].n,
                         "navIr('" + nav.mod + "','" + ordem[j] + "')");
      }
    } else {
      var items = [];
      for (j = 0; j < lista.length; j++) if (tipoDe(lista[j]).codigo === nav.sub) items.push(lista[j]);
      var tt = items.length ? tipoDe(items[0]) : { nome: 'Tarefas' };
      html += '<div class="nav-tit">' + esc(tt.nome) + ' (' + items.length + ')</div>';
      for (j = 0; j < items.length && j < nav.lim; j++) html += cardModHtml(items[j]);
      if (items.length > nav.lim) html += '<button class="mais-btn" onclick="navMais()">Mostrar mais (' + (items.length - nav.lim) + ')</button>';
    }
  }
  if (!nav.mod) html += avisoSemFotoHtml();
  html += '<div class="refresh-bar" id="refreshBar">Atualiza em 60s</div>';
  cont.innerHTML = html;
  if (nav.mod === 'novoped' || nav.mod === 'conf' || (nav.mod === 'cores' && nav.sub)) S.formBuilt = true;
}

/* Carrega tipos de OT e as funções (subsetores) do operador — uma vez por login */
function prepararContexto(cb) {
  if (S.ctxOk) { cb(); return; }
  function fim() { S.ctxOk = true; cb(); }
  sbGet('tipos_ot', 'select=id,codigo,nome,grupo,subsetor_id', function(err, tipos) {
    var m = {}, i;
    if (!err && tipos) for (i = 0; i < tipos.length; i++) m[tipos[i].id] = tipos[i];
    S.tipos = m;
    S.meusSubs = [];
    var cid = S.colaborador ? S.colaborador.id : '';
    /* 1) funções do operador, definidas livremente em Funcionários → 🏭 (tabela colaborador_subsetores) */
    sbGet('colaborador_subsetores', 'colaborador_id=eq.' + encodeURIComponent(cid) + '&select=subsetor_id', function(e1, caps) {
      if (!e1 && caps) for (i = 0; i < caps.length; i++) S.meusSubs.push(caps[i].subsetor_id);
      if (S.meusSubs.length) { fim(); return; }
      /* 2) estação padrão */
      var eid = S.colaborador && S.colaborador.estacao_padrao_id;
      if (eid) {
        sbGet('estacoes', 'id=eq.' + encodeURIComponent(eid) + '&select=subsetor_id', function(e2, est) {
          if (!e2 && est && est.length && est[0].subsetor_id) S.meusSubs.push(est[0].subsetor_id);
          fim();
        });
        return;
      }
      /* 3) cargo → subsetor */
      var cg = String((S.colaborador && S.colaborador.cargo) || '').toLowerCase().replace(/\s+/g, '');
      var nomeSub = CARGO_SUBSETOR[cg];
      if (!nomeSub) { fim(); return; }
      sbGet('subsetores', 'nome=eq.' + encodeURIComponent(nomeSub) + '&select=id', function(e3, sub) {
        if (!e3 && sub && sub.length) S.meusSubs.push(sub[0].id);
        fim();
      });
    });
  });
}

function abrirDetalhe(otId) {
  pararTimer();
  S.view = 'detalhe';
  S.ot = null; S.tipo = null; S.peca = null; S.roteiros = []; S.pedido = null; S.pecaViaPlano = false;
  S.checklist = []; S.fotoOk = false;
  render();

  /* 1. Buscar OT */
  sbGet('ordens_trabalho',
    'id=eq.' + otId +
    '&select=id,codigo_publico,titulo,instrucoes,quantidade,status,' +
    'tipo_ot_id,peca_id,pedido_id,plano_id,inicio_real,responsavel_id,' +
    'quantidade_concluida,quantidade_perdida_acumulada,ordem_execucao',
    function(err, data) {
      if (err || !data || !data.length) {
        var c = document.getElementById('cont');
        if (c) c.innerHTML = '<div class="vazio"><div>OT não encontrada.</div></div>' +
          '<button class="btn btn-vol" onclick="voltarInbox()">← Voltar</button>';
        return;
      }
      S.ot = data[0];

      /* 2. Buscar tipo_ot */
      sbGet('tipos_ot', 'id=eq.' + S.ot.tipo_ot_id + '&select=id,nome,codigo,icone', function(err2, td) {
        S.tipo = (td && td.length) ? td[0] : null;

        /* 3. Buscar checklist */
        sbGet('ot_checklist', 'ot_id=eq.' + otId + '&order=ordem&select=id,texto,ordem,obrigatorio,concluido',
          function(err3, chks) {
            S.checklist = chks || [];

            /* 4. Buscar peça (direta ou via plano/OP) */
            resolverPecaId(function(pid) {
              if (pid) {
                sbGet('pecas_proprias',
                  'id=eq.' + pid + '&select=id,modelo,codigo_publico,foto_base64,preco,roteiro_id',
                  function(err4, pd) {
                    S.peca = (pd && pd.length) ? pd[0] : null;
                    if (S.tipo && S.tipo.codigo === 'completar_ficha') {
                      sbGet('roteiros', 'ativo=eq.true&order=nome&select=id,codigo_publico,nome', function(e5, rs) {
                        S.roteiros = rs || [];
                        carregarPedidoEDetalhe();
                      });
                    } else { carregarPedidoEDetalhe(); }
                  });
              } else {
                carregarPedidoEDetalhe();
              }
            });
          }
        );
      });
    }
  );
}

/* ─────────────────────────────────────────
   AÇÕES
───────────────────────────────────────── */
function acaoOT(novoStatus, tipoEvento) {
  if (!S.ot) return;
  var ot      = S.ot;
  var colabId = S.colaborador ? S.colaborador.id : null;

  var payload = { status: novoStatus };
  if (novoStatus === 'iniciada' && !ot.inicio_real) {
    payload.inicio_real = new Date().toISOString();
  }
  if (novoStatus === 'iniciada' && colabId) {
    payload.responsavel_id = colabId;
  }

  /* Desabilitar botões durante o request */
  var btns = document.querySelectorAll('.btn');
  for (var i = 0; i < btns.length; i++) btns[i].disabled = true;

  sbPatch('ordens_trabalho', 'id=eq.' + ot.id, payload, function(err) {
    if (err) {
      toast('Erro: ' + err.message, true);
      var btns2 = document.querySelectorAll('.btn');
      for (var i = 0; i < btns2.length; i++) btns2[i].disabled = false;
      return;
    }

    /* Atualizar estado local */
    S.ot.status = novoStatus;
    if (payload.inicio_real)    S.ot.inicio_real    = payload.inicio_real;
    if (payload.responsavel_id) S.ot.responsavel_id = payload.responsavel_id;

    /* Registrar evento (best-effort) */
    var evento = {
      ot_id:      ot.id,
      tipo:       novoStatus,
      descricao:  'Status → ' + novoStatus + (colabId ? ' (terminal)' : ''),
      estacao_id: null,
      motivo:     null
    };
    sbPost('ot_eventos', evento, function() {});

    var msgs = {
      iniciada: 'Tarefa iniciada! ▶',
      pausada:  'Tarefa pausada. ⏸',
      retomada: 'Tarefa retomada! ▶',
      concluida:'Tarefa concluída! ✅'
    };
    toast(msgs[novoStatus] || 'Atualizado.');
    renderDetalhe();
  });
}

/* ── Missão em destaque ── */
function missaoHtml() {
  var ot = S.ot;
  if (!ot) return '';
  var m = String(ot.titulo || '').match(/^\s*(Imprimir|Pintar)\s+(.+?)\s*[×xX]\s*(\d+)\s*$/i);
  if (!m) return '';
  var verbo = m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase();
  var total = nInt(m[3]) || ot.quantidade || 0;
  var feito = ot.quantidade_concluida || 0, perd = ot.quantidade_perdida_acumulada || 0;
  var falta = Math.max(0, (ot.quantidade || total) - feito - perd);
  var instr = String(ot.instrucoes || '');
  var mNec = instr.match(/Necess[áa]rio:\s*(\d+)/i);
  var mPint = instr.match(/Pintados?:\s*(\d+)/i);
  var mImp = instr.match(/(?:Impressos dispon[íi]veis|impressos):\s*(\d+)/i);
  var linhas = [];
  if (mNec) linhas.push('Para fechar o pedido são necessárias <b>' + mNec[1] + '</b> un. de ' + esc(m[2]));
  if (mPint && verbo === 'Pintar') linhas.push('Já pintadas antes: <b>' + mPint[1] + '</b>');
  if (mImp && verbo === 'Pintar') linhas.push('Impressas disponíveis: <b>' + mImp[1] + '</b>');
  if (feito > 0 || perd > 0) linhas.push('Já feitas nesta tarefa: <b>' + feito + '</b> feitas' + (perd ? ' · <b>' + perd + '</b> perdidas' : ''));
  var h = '<div class="card" style="text-align:center;border:2px solid #7c3aed;background:#1e1b4b;">' +
    '<div style="font-size:.7rem;letter-spacing:.14em;font-weight:700;color:#a78bfa;margin-bottom:6px">SUA MISSÃO</div>' +
    '<div style="font-size:1.4rem;font-weight:800;line-height:1.35;color:#f1f5f9">' + verbo +
    ' <span style="background:#7c3aed;border-radius:8px;padding:0 10px">' + (falta > 0 && falta !== total ? falta : total) + '</span>' + (falta > 0 && falta !== total ? ' de ' + total : '') + ' unidade' + ((falta > 0 && falta !== total ? total : total) === 1 ? '' : 's') +
    ' de <span style="color:#c4b5fd">' + esc(m[2]) + '</span>' +
    (S.peca && S.peca.modelo ? ' da peça <span style="color:#c4b5fd">' + esc(S.peca.modelo) + '</span>' : '') + '</div>' +
    (linhas.length ? '<div style="margin-top:10px;padding-top:8px;border-top:1px dashed #6d28d9;font-size:.85rem;color:#cbd5e1;line-height:1.6">' + linhas.join('<br>') + '</div>' : '') +
    '</div>';
  return h;
}

    '<div id="pd-r" style="margin-top:10px;background:#1e1b4b;color:#c4b5fd;border-radius:8px;padding:8px 10px;font-size:.85rem"></div>';
  janelaFim('PRODUÇÃO DO DIA', esc(ot.titulo || ''), box, 'Salvar produção do dia', salvarProducaoDoDia);
  var calc = function() {

function salvarProducaoDoDia() {
  var ot = S.ot; if (!ot) return;
  var ja = ot.quantidade_concluida || 0, ap = ot.quantidade_perdida_acumulada || 0;
  var rest = Math.max(0, ot.quantidade - ja - ap);
  var f = nInt(jfVal('pd-f')), e = nInt(jfVal('pd-e')), obs = String(jfVal('pd-o')).replace(/^\s+|\s+$/g, '');
  if (f + e === 0) { toast('Informe quantas peças você pintou hoje.', true); return; }
  if (f + e > rest) { toast('Essa soma (' + (f + e) + ') passa do que falta (' + rest + ').', true); return; }
  var novaC = ja + f, novaP = ap + e, resta = ot.quantidade - novaC - novaP;
  var colab = S.colaborador ? S.colaborador.id : null;
  var upd = { quantidade_concluida: novaC, quantidade_perdida_acumulada: novaP };
  if (colab) upd.responsavel_id = colab;
  if (obs) upd.instrucoes = String((ot.instrucoes || '') + '\n[' + fmtDataT(new Date().toISOString()) + '] Fim do dia: ' + obs).replace(/^\s+/, '');
  sbPatch('ordens_trabalho', 'id=eq.' + ot.id, upd, function(err) {
    if (err) { toast('Erro: ' + err.message, true); return; }
    ot.quantidade_concluida = novaC; ot.quantidade_perdida_acumulada = novaP;
    if (upd.instrucoes) ot.instrucoes = upd.instrucoes;
    sbPost('ot_eventos', { ot_id: ot.id, tipo: 'fornada', descricao: 'Produção do dia — pintadas: ' + f + ', estragadas: ' + e + ' (acumulado ' + novaC + '/' + ot.quantidade + ')' + (obs ? ' · ' + obs : '') + ' (terminal)', estacao_id: null, motivo: null }, function() {});
    fecharJanelaFim();
    if (resta > 0) {
      sbPatch('ordens_trabalho', 'id=eq.' + ot.id, { status: 'pausada' }, function() {
        sbPost('ot_eventos', { ot_id: ot.id, tipo: 'pausada', descricao: 'Fim do dia — pausada. Faltam ' + resta + ' (terminal)', estacao_id: null, motivo: null }, function() {});
        toast('Produção do dia salva: ' + f + ' pintadas. Faltam ' + resta + ' — continue amanhã.');
        voltarInbox();
      });
      return;
    }
    toast('Tudo pintado! Agora feche a pintura.');
    S.ot.status = ot.status;
    fimEtapa();
  });
}

/* ── despacho do botão Concluir por tipo de tarefa ── */
function concluirPorTipo() {
  var cod = codTipo(), ot = S.ot;
  if (!ot || !cod) return false;
  var i, pend = false;
  for (i = 0; i < S.checklist.length; i++) { if (S.checklist[i].obrigatorio && !S.checklist[i].concluido) pend = true; }
  if (pend) { toast('Complete os itens obrigatórios (*) antes de concluir.', true); return true; }
  var rest = Math.max(0, (ot.quantidade || 0) - (ot.quantidade_concluida || 0) - (ot.quantidade_perdida_acumulada || 0));
  if (ehPorTurno() && rest > 0) { producaoDoDia(); return true; }
  if (cod === 'conferencia' || cod === 'embalagem') { fimConferencia(); return true; }
  if (cod === 'expedicao' && S.pedido && S.pedido.status !== 'enviado') { toast('Use o botão "Marcar como enviado", mais acima.', true); return true; }
  for (i = 0; i < TIPOS_ETAPA.length; i++) { if (TIPOS_ETAPA[i] === cod) { fimEtapa(); return true; } }
  return false;
}


/* ─────────────────────────────────────────
   Estoque guiado (v155) — "Onde pegar" na tarefa de Separação (ES5)
   Mostra o endereço de cada componente e, ao confirmar, leva para a MESA-SEPARACAO.
───────────────────────────────────────── */
var TIPOS_RETIRA = ['separacao', 'pintura', 'montagem', 'conferencia', 'embalagem', 'expedicao'];
function podeRetirarEstoque() {
  var i, c = codTipo();
  if (!S.ot || !((S.peca && S.peca.id) || S.ot.peca_id)) { return false; }
  for (i = 0; i < TIPOS_RETIRA.length; i++) { if (TIPOS_RETIRA[i] === c) { return true; } }
  return false;
}
function abrirOndePegar(qtdManual) {
  var ot = S.ot;
  var pecaId = (S.peca && S.peca.id) || (ot && ot.peca_id);
  if (!ot || !pecaId) { toast('Esta tarefa não está ligada a uma peça.', true); return; }
  var ehPint = codTipo() === 'pintura';
  var qtd = qtdManual || (ehPint ? Math.max(1, (ot.quantidade || 1) - (ot.quantidade_concluida || 0) - (ot.quantidade_perdida_acumulada || 0)) : (ot.quantidade || 1));
  janelaFim('ONDE PEGAR', esc(ot.titulo || ''), '<div style="color:#94a3b8;font-size:.9rem">Buscando endereços…</div>', 'Retirei tudo', function() {});
  document.getElementById('jf-ok').style.display = 'none';
  sbGet('peca_componentes', 'peca_id=eq.' + pecaId + '&select=id,nome&order=created_at', function(e1, comps) {
    if (e1 || !comps) { toast('Erro ao buscar componentes.', true); fecharJanelaFim(); return; }
    if (!comps.length) { fecharJanelaFim(); toast('Esta peça não tem componentes cadastrados.', true); return; }
    var ids = [], i;
    for (i = 0; i < comps.length; i++) { ids.push(comps[i].id); }
    sbGet('inventario_fisico', 'entity_type=eq.componente&entity_id=in.(' + ids.join(',') + ')&quantidade=gt.0&select=id,endereco_id,entity_id,quantidade,etapa_id', function(e2, inv) {
      if (e2 || !inv) { fecharJanelaFim(); toast('Estoque guiado ainda não configurado (rodar SQL passo 9).', true); return; }
      sbGet('enderecos', 'select=id,codigo', function(e3, ends) {
        sbGet('etapas_processo', 'select=id,codigo,processos_produtivos(codigo)', function(e4, ets) {
          var cod = {}, mesaId = null, pint = null, brut = null, k;
          for (k = 0; k < (ends || []).length; k++) { cod[ends[k].id] = ends[k].codigo; if (ends[k].codigo === 'MESA-SEPARACAO') { mesaId = ends[k].id; } }
          for (k = 0; k < (ets || []).length; k++) {
            if (ets[k].processos_produtivos && ets[k].processos_produtivos.codigo === 'pintura') {
              if (ets[k].codigo === 'pintado') { pint = ets[k].id; }
              if (ets[k].codigo === 'bruto') { brut = ets[k].id; }
            }
          }
          var plano = [], total = 0, h = '';
          for (i = 0; i < comps.length; i++) {
            var falta = qtd, pegar = [], pass, j;
            var ordem = ehPint ? [brut, pint] : [pint, brut];
            for (pass = 0; pass < 2; pass++) {
              var lst = [];
              for (j = 0; j < inv.length; j++) {
                if (inv[j].entity_id === comps[i].id && (inv[j].etapa_id || null) === (ordem[pass] || null) && inv[j].endereco_id !== mesaId) { lst.push(inv[j]); }
              }
              lst.sort(function(a, b) { return b.quantidade - a.quantidade; });
              for (j = 0; j < lst.length && falta > 0; j++) {
                var t = Math.min(falta, parseFloat(lst[j].quantidade) || 0);
                if (t > 0) { pegar.push({ row: lst[j], qtd: t, pintado: ordem[pass] === pint }); falta -= t; total += t; }
              }
            }
            plano.push({ comp: comps[i], pegar: pegar, falta: falta });
            h += '<div style="padding:8px 0;border-bottom:1px solid #1e293b"><div style="font-weight:700;color:#f1f5f9">' + esc(String(comps[i].nome || '').replace(/\s+$/, '')) + ' — ' + qtd + ' un.</div>';
            if (!pegar.length) { h += '<div style="color:#fbbf24;font-size:.85rem">Sem endereço registrado. Procure e avise o supervisor.</div>'; }
            for (j = 0; j < pegar.length; j++) {
              h += '<div style="color:#cbd5e1;font-size:.95rem">📍 <b style="color:#4ade80">' + esc(cod[pegar[j].row.endereco_id] || '?') + '</b> · pegue <b>' + pegar[j].qtd + '</b> <span style="color:#64748b;font-size:.75rem">(' + (pegar[j].pintado ? 'pintado' : 'sem pintura') + ')</span></div>';
            }
            if (falta > 0 && pegar.length) { h += '<div style="color:#fbbf24;font-size:.8rem">Faltam ' + falta + ' sem endereço registrado.</div>'; }
            h += '</div>';
          }
          var ov = document.getElementById('fech-overlay');
          if (!ov) { return; }
          ov.firstChild.childNodes[1].innerHTML = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="color:#94a3b8;font-size:.85rem">Quantas peças?</span><input id="op-q" type="number" min="1" value="' + qtd + '" style="width:80px;padding:8px;text-align:center;background:#1e293b;color:#f1f5f9;border:1px solid #475569;border-radius:8px;font-size:1.1rem"></div>' + h + '<div style="font-size:.75rem;color:#64748b;margin-top:10px">Ao confirmar, os itens vão para a mesa de trabalho.</div>' +
            '<div style="display:flex;gap:12px;margin-top:14px"><button id="op-c" style="flex:1;padding:14px;background:#1e293b;color:#94a3b8;border:1px solid #334155;border-radius:8px;font-size:1rem">Fechar</button>' +
            (total > 0 && mesaId ? '<button id="op-ok" style="flex:2;padding:14px;background:#22c55e;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700">Retirei tudo</button>' : '') + '</div>';
          document.getElementById('op-c').onclick = fecharJanelaFim;
          document.getElementById('op-q').onchange = function() { var n = nInt(this.value); if (n > 0) { abrirOndePegar(n); } };
          var okb = document.getElementById('op-ok');
          if (okb) {
            okb.onclick = function() {
              okb.disabled = true;
              var fila = [], p, q;
              for (p = 0; p < plano.length; p++) { for (q = 0; q < plano[p].pegar.length; q++) { fila.push({ comp: plano[p].comp, it: plano[p].pegar[q] }); } }
              levarParaMesa(fila, mesaId, 0);
            };
          }
        });
      });
    });
  });
}

/* tira da prateleira (zera/subtrai), soma na mesa e registra a movimentação — um item por vez */
function levarParaMesa(fila, mesaId, idx) {
  if (idx >= fila.length) { fecharJanelaFim(); toast('Itens levados para a Mesa de separação. ✅'); return; }
  var it = fila[idx].it, row = it.row, resta = Math.round(((parseFloat(row.quantidade) || 0) - it.qtd) * 1000) / 1000;
  var seguir = function() { levarParaMesa(fila, mesaId, idx + 1); };
  sbGet('inventario_fisico', 'endereco_id=eq.' + mesaId + '&entity_type=eq.componente&entity_id=eq.' + row.entity_id + '&select=id,quantidade,etapa_id', function(e1, ja) {
    var existente = null, i;
    for (i = 0; i < (ja || []).length; i++) { if ((ja[i].etapa_id || null) === (row.etapa_id || null)) { existente = ja[i]; } }
    var gravaMesa = function(cb) {
      if (existente) { sbPatch('inventario_fisico', 'id=eq.' + existente.id, { quantidade: (parseFloat(existente.quantidade) || 0) + it.qtd }, function(err) { cb(err); }); }
      else { sbPost('inventario_fisico', { id: uuidT(), endereco_id: mesaId, entity_type: 'componente', entity_id: row.entity_id, quantidade: it.qtd, etapa_id: row.etapa_id || null }, function(err) { cb(err); }); }
    };
    gravaMesa(function(err) {
      if (err) { toast('Erro: ' + err.message, true); return; }
      sbPatch('inventario_fisico', 'id=eq.' + row.id, { quantidade: resta < 0 ? 0 : resta }, function(err2) {
        if (err2) { toast('Erro: ' + err2.message, true); return; }
        sbPost('movimentacoes_fisicas', { id: uuidT(), entity_type: 'componente', entity_id: row.entity_id, endereco_origem_id: row.endereco_id, endereco_destino_id: mesaId, quantidade: it.qtd,
          etapa_origem_id: row.etapa_id || null, etapa_destino_id: row.etapa_id || null, motivo: 'transferencia', responsavel: S.colaborador ? S.colaborador.nome : null, observacao: 'Retirada guiada (terminal)' }, function() { seguir(); });
      });
    });
  });
}

    '<div style="background:#0f172a;border:1px solid #334155;border-radius:12px;padding:0;max-width:360px;width:92%;margin:auto;">' +

          iboa.value = 0;        iboa.readOnly = true;
          iperd.value = qtdPlan; iperd.readOnly = true;

    var qtdPerd = parseInt(document.getElementById('fech-perd').value) || 0;
    var obs     = (document.getElementById('fech-obs').value || '').trim();
    document.body.removeChild(overlay);
    fecharOT(resultado, qtdBoa, qtdPerd, obs);

}

function fecharOT(resultado, qtdBoa, qtdPerd, obs) {
  var ot      = S.ot;
  var colabId = S.colaborador ? S.colaborador.id : null;
  if (!ot) return;

  var agora       = new Date().toISOString();
  var h           = new Date().getHours();
  var turno       = h >= 6 && h < 12 ? 'manha' : h >= 12 && h < 18 ? 'tarde' : 'noite';
  var novoStatus  = resultado === 'cancelada' ? 'cancelada' : 'concluida';

  var payload = {
    status:                novoStatus,
    fechamento_resultado:  resultado,
    qtd_boa:               novoStatus === 'concluida' ? qtdBoa : 0,
    qtd_perdida:           novoStatus === 'cancelada' ? 0 : qtdPerd,
    observacao_fechamento: obs || null,
    turno:                 turno,
    fechado_em:            agora,
    fim_real:              agora
  };

  if (ot.inicio_real) {
    var min = Math.round((new Date(agora) - new Date(ot.inicio_real)) / 60000);
    if (min > 0) { payload.duracao_real_min = min; }
  }
  if (!ot.inicio_real) { payload.inicio_real = agora; }
  if (colabId && !ot.responsavel_id) { payload.responsavel_id = colabId; }

  var btns = document.querySelectorAll('.btn');
  for (var i = 0; i < btns.length; i++) btns[i].disabled = true;

  sbPatch('ordens_trabalho', 'id=eq.' + ot.id, payload, function(err) {
    if (err) {
      toast('Erro: ' + err.message, true);
      var btns2 = document.querySelectorAll('.btn');
      for (var i = 0; i < btns2.length; i++) btns2[i].disabled = false;
      return;
    }
    S.ot.status = novoStatus;
    if (novoStatus === 'concluida') { liberarBloqueadas(ot.id); }

    var descEvento = 'Fechamento: ' + resultado +
      ' · Boas: ' + payload.qtd_boa +
      ' · Perdas: ' + payload.qtd_perdida +
      (obs ? ' · ' + obs : '') + ' (terminal)';
    sbPost('ot_eventos', {
      ot_id:      ot.id,
      tipo:       novoStatus,
      descricao:  descEvento,
      estacao_id: null,
      motivo:     null
    }, function() {});

    var msg = resultado === 'sucesso'   ? 'Tarefa concluída com sucesso! ✅' :
              resultado === 'parcial'   ? 'Fechamento parcial registrado. ⚠️' :
              resultado === 'falha'     ? 'Falha registrada.' :
              'Tarefa cancelada.';
    if (S.msgExtra) { msg += ' ' + S.msgExtra; S.msgExtra = ''; }
    toast(msg);
    renderDetalhe();
  });
}

function toggleCheck(checkId) {
  var item = null;
  for (var i = 0; i < S.checklist.length; i++) {
    if (S.checklist[i].id === checkId) { item = S.checklist[i]; break; }
  }
  if (!item) return;
  var novo = !item.concluido;
  sbPatch('ot_checklist', 'id=eq.' + checkId, { concluido: novo }, function(err) {
    if (err) { toast('Erro ao salvar: ' + err.message, true); return; }
    item.concluido = novo;
    renderDetalhe();
  });
}


/* ─────────────────────────────────────────
   COMPLETAR FICHA (tipo completar_ficha): preço + roteiro da peça.
   Foto é carregada pelo computador; aqui só mostra se existe.
───────────────────────────────────────── */
function ehTipoFicha() { return !!(S.tipo && S.tipo.codigo === 'completar_ficha'); }

function fichaHtmlBloco() {
  var peca = S.peca;
  if (!ehTipoFicha()) return '';
  if (!peca) return '<div class="card"><div class="card-label">📝 Ficha da peça</div><div class="instrucoes">Esta tarefa não está ligada a uma peça. Avise o supervisor.</div></div>';
  var opts = '<option value="">— escolher roteiro —</option>', i, r;
  for (i = 0; i < (S.roteiros || []).length; i++) {
    r = S.roteiros[i];
    opts += '<option value="' + r.id + '"' + (peca.roteiro_id === r.id ? ' selected' : '') + '>' +
      esc((r.codigo_publico ? '[' + r.codigo_publico + '] ' : '') + r.nome) + '</option>';
  }
  var precoVal = (peca.preco && peca.preco > 0) ? String(peca.preco).replace('.', ',') : '';
  return '<div class="card"><div class="card-label">📝 Ficha: ' + esc(peca.modelo || peca.codigo_publico || '') + '</div>' +
    '<div class="ficha-lbl">Preço de venda (R$)</div>' +
    '<input class="ficha-in" id="fichaPreco" type="text" inputmode="decimal" value="' + esc(precoVal) + '" placeholder="Ex.: 180,00">' +
    '<div class="ficha-lbl">Roteiro de fabricação</div>' +
    '<select class="ficha-in" id="fichaRot">' + opts + '</select>' +
    '<div class="ficha-lbl">Foto</div>' +
    (peca.foto_base64 ? '<div class="ficha-ok">✓ Foto cadastrada</div>' :
      '<div class="ficha-pend">Sem foto. Pode concluir assim; carregue depois pelo computador ou celular.</div>') +
    '<button class="btn btn-conc" id="btnSalvarFicha" onclick="salvarFicha()">💾 Salvar ficha</button></div>';
}

function salvarFicha() {
  var peca = S.peca, ot = S.ot;
  if (!peca || !ot) return;
  var cont = document.getElementById('cont');
  var inpP = cont.querySelector('#fichaPreco'), selR = cont.querySelector('#fichaRot');
  var preco = parseFloat(String(inpP.value || '').replace(/\./g, '').replace(',', '.'));
  var rot = selR.value || null;
  var patch = {};
  if (!isNaN(preco) && preco > 0) patch.preco = preco;
  if (rot) patch.roteiro_id = rot;
  var temPreco = (patch.preco > 0) || (peca.preco > 0);
  var temRot = !!(patch.roteiro_id || peca.roteiro_id);
  if (!patch.preco && !patch.roteiro_id) { toast('Preencha o preço ou escolha o roteiro.', true); return; }
  var btn = cont.querySelector('#btnSalvarFicha'); if (btn) btn.disabled = true;
  sbPatch('pecas_proprias', 'id=eq.' + peca.id, patch, function(err) {
    if (btn) btn.disabled = false;
    if (err) { toast('Erro ao salvar: ' + err.message, true); return; }
    if (patch.preco) peca.preco = patch.preco;
    if (patch.roteiro_id) peca.roteiro_id = patch.roteiro_id;
    var falta = [];
    if (!temRot) falta.push('roteiro');
    if (!temPreco) falta.push('preço');
    if (falta.length) {
      toast('Salvo. Ainda falta: ' + falta.join(', '));
      renderDetalhe();
      return;
    }
    /* Preço + roteiro preenchidos: fecha a tarefa mesmo sem foto */
    if (!peca.foto_base64) {
      carregarSemFoto(function() {
        var n = (S.semFoto || []).length;
        /* a peça atual já saiu da lista só se tiver foto; aqui continua sem foto */
        S.msgExtra = 'Existem ' + n + ' fichas sem foto no sistema.';
        fecharOT('sucesso', 1, 0, 'Ficha completada no tablet (sem foto)');
      });
    } else {
      fecharOT('sucesso', 1, 0, 'Ficha completada no tablet');
    }
  });
}

function fmtMoeda(v) { return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ','); }

function carregarPedidoEDetalhe() {
  var cod = S.tipo ? S.tipo.codigo : '';
  S.pedido = null;
  S.coresPeca = [];
  if (cod === 'pintura' && S.peca && S.peca.id) {
    sbGet('pecas_cores', 'peca_id=eq.' + S.peca.id + '&order=ordem&select=parte,cor_numero,ordem,cores(nome,familia,hex,prateleira)', function(err, d) {
      S.coresPeca = (!err && d) ? d : [];
      renderDetalhe();
    });
    return;
  }
  if (S.ot && S.ot.pedido_id && (cod === 'expedicao' || cod === 'pos_compra' || cod === 'cobrar_empenho' || cod === 'cobranca' || cod === 'confirmacao_pagamento' || cod === 'aprovacao_arte' || cod === 'aprovacao_orcamento' || ehOtComercial())) {
    buscarPedidoT(S.ot.pedido_id, function(p) { S.pedido = p; renderDetalhe(); });
  } else {
    renderDetalhe();
  }
}

function envioHtmlBloco() {
  if (!S.tipo || S.tipo.codigo !== 'expedicao' || !S.pedido) return '';

  if (p.contato) h += '<div class="ficha-lbl">Contato</div><div class="ficha-ok" style="color:#f1f5f9">' + esc(p.contato) + '</div>';
  h += '<div class="ficha-lbl">Saldo a receber (total − entrada)</div><div class="ficha-ok" style="color:' + (saldo > 0 ? '#fdba74' : '#4ade80') + '">' + fmtMoeda(saldo) + '</div>';
  if (p.status === 'enviado') {
    h += '<div class="ficha-ok">✓ Pedido já marcado como enviado' + (p.codigo_rastreio ? ' · rastreio ' + esc(p.codigo_rastreio) : '') + '</div></div>';

  h += '<div class="ficha-lbl">Transportadora / forma de envio</div>' +

    '<div class="ficha-lbl">Código de rastreio (se houver)</div>' +

  if (saldo > 0) {
    h += '<div class="foto-check"><input type="checkbox" id="envSaldo"><label for="envSaldo">Saldo quitado / combinado com o cliente</label></div>';
  }
  h += '<button class="btn btn-conc" id="btnEnviar" onclick="marcarEnviado()" style="margin-top:12px">🚚 Marcar como enviado</button></div>';

function marcarEnviado() {
  var cont = document.getElementById('cont'), p = S.pedido, ot = S.ot;
  if (!p || !ot) return;
  var transp = (cont.querySelector('#envTransp').value || '').replace(/^\s+|\s+$/g, '');
  var rast = (cont.querySelector('#envRastreio').value || '').replace(/^\s+|\s+$/g, '');
  var chk = cont.querySelector('#envSaldo');
  if (!transp) { toast('Informe a transportadora / forma de envio.', true); return; }
  if (chk && !chk.checked) { toast('Confirme o saldo antes de enviar.', true); return; }
  var btn = cont.querySelector('#btnEnviar'); if (btn) btn.disabled = true;
  var patch = { transportadora: transp, codigo_rastreio: rast || null, enviado_em: new Date().toISOString(), status: 'enviado' };
  sbPatch('pedidos', 'id=eq.' + p.id, patch, function(err) {
    if (err) { if (btn) btn.disabled = false; toast('Erro: ' + err.message, true); return; }
    p.status = 'enviado';
    fecharOT('sucesso', ot.quantidade || 1, 0, 'Enviado via ' + transp + (rast ? ' · rastreio ' + rast : '') + ' (terminal)');
  });
}

}
function posCompraOk() { fecharOT('sucesso', 1, 0, 'Pós-compra: tudo certo (terminal)'); }
function posCompraProblema(etapa) {
  var cont = document.getElementById('cont');
  if (etapa === 1) { cont.querySelector('#pcProbBox').style.display = 'block'; return; }
  var txt = (cont.querySelector('#pcProb').value || '').replace(/^\s+|\s+$/g, '');

  for (k in S.tipos) { if (S.tipos[k].codigo === 'contato_cliente') { tipo = S.tipos[k]; break; } }

  sbPost('ordens_trabalho', {
    titulo: 'Ocorrência pós-compra: ' + (S.pedido.cliente || 'cliente'),
    status: 'pendente', tipo_ot_id: tipo.id, subsetor_id: tipo.subsetor_id,
    pedido_id: S.pedido.id, quantidade: 1, ordem_execucao: 0,
    instrucoes: 'Problema relatado no pós-compra: ' + txt
  }, function(err) {
    if (err) { toast('Erro: ' + err.message, true); return; }
    S.msgExtra = 'Ocorrência aberta.';
    fecharOT('sucesso', 1, 0, 'Pós-compra com problema: ' + txt + ' (terminal)');
  });
}

function fmtData(d) { if (!d) return '—'; var p = String(d).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d; }

    (inst ? '<div style="' + JF_LBL + '">QUEM DECIDE NO ÓRGÃO? (NOME E SETOR)</div><input id="fc-r" type="text" value="' + esc((p && p.responsavel_decisao) || '') + '" style="' + JF_IN + '">' : '');

function salvarFechouT(p, inst) {
  if (!p) { toast('Pedido não encontrado.', true); return; }
  var forma = S.fcForma, acordo = String(jfVal('fc-a')).replace(/^\s+|\s+$/g, '');
  var upd = { forma_pagamento: forma, acordo_comercial: acordo || null }, pos = null, resumo = '';
  if (inst) { upd.responsavel_decisao = String(jfVal('fc-r')).replace(/^\s+|\s+$/g, '') || null; }
  if (forma === 'empenho') {
    var num = String(jfVal('fc-n')).replace(/^\s+|\s+$/g, '');
    upd.numero_empenho = num || null; upd.pagamento_previsto = null;
    if (num) { resumo = 'empenho ' + num + ' registrado'; } else { resumo = 'aguardando empenho'; pos = 'cobrar_empenho'; }
  } else {

/* ─────────────────────────────────────────

function uuid4() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    var r = Math.floor(Math.random() * 16), v = (c === 'x') ? r : ((r % 4) + 8);
    return v.toString(16);
  });
}
function navNovoPedido() {
  sbGet('pecas_proprias', 'select=id,modelo,codigo_publico,preco&order=modelo', function(err, d) {

}
function novoPedidoHtml() {

  for (i = 0; i < pl.length; i++) opts += '<option value="' + pl[i].id + '">' + esc((pl[i].codigo_publico ? pl[i].codigo_publico + ' · ' : '') + (pl[i].modelo || '')) + '</option>';
  var h = '<div class="nav-tit">Cadastrar pedido</div><div class="card">' +
    '<div class="ficha-lbl">Cliente *</div><input class="ficha-in" id="np_cliente" type="text">' +
    '<div class="ficha-lbl">Contato (WhatsApp)</div><input class="ficha-in" id="np_contato" type="text">' +
    '<div class="ficha-lbl">Origem do produto</div><select class="ficha-in" id="np_orig" onchange="npOrig()"><option value="false">Sob encomenda (fora do catálogo)</option><option value="true">Do catálogo (Peças próprias)</option></select>' +
    '<div id="np_pecaWrap" style="display:none"><div class="ficha-lbl">Peça do catálogo</div><select class="ficha-in" id="np_peca" onchange="npPeca()">' + opts + '</select></div>' +
    '<div class="ficha-lbl">Nome do modelo / peça *</div><input class="ficha-in" id="np_modelo" type="text">' +
    '<div class="ficha-lbl">Quantidade</div><input class="ficha-in" id="np_qtd" type="text" inputmode="numeric" value="1" oninput="npRecalc()">' +
    '<div class="ficha-lbl">Valor unitário (R$)</div><input class="ficha-in" id="np_unit" type="text" inputmode="decimal" oninput="npRecalc()">' +
    '<div class="ficha-lbl">Valor total (R$)</div><input class="ficha-in" id="np_total" type="text" inputmode="decimal">' +
    '<div class="ficha-lbl">Entrada recebida (R$)</div><input class="ficha-in" id="np_entrada" type="text" inputmode="decimal" value="0">' +
    '<div class="ficha-lbl">Data de entrega</div><input class="ficha-in" id="np_data" type="date">' +
    '<div class="ficha-lbl">Prioridade</div><select class="ficha-in" id="np_prio"><option value="normal">Normal</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select>' +
    '<div class="ficha-lbl">Canal de venda</div><select class="ficha-in" id="np_canal"><option value="direto">Direto</option><option value="shopee">Shopee</option><option value="mercado_livre">Mercado Livre</option><option value="outro">Outro</option></select>' +
    '<div class="ficha-lbl">Observações e referências</div><textarea class="ficha-in" id="np_obs" rows="3"></textarea></div>' +
    '<div class="card"><div class="card-label">Conferência antes de registrar</div>';
  for (i = 0; i < CONF_PEDIDO.length; i++) {

function npNum(id) {
  var v = String(document.getElementById('cont').querySelector('#' + id).value || '').replace(/\s/g, '');
  if (v.indexOf(',') >= 0) v = v.replace(/\./g, '').replace(',', '.');
  var n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}
function npOrig() {
  var c = document.getElementById('cont');
  c.querySelector('#np_pecaWrap').style.display = (c.querySelector('#np_orig').value === 'true') ? 'block' : 'none';
}
function npPeca() {
  var c = document.getElementById('cont'), id = c.querySelector('#np_peca').value, l = S.pecasLista || [], i;
  for (i = 0; i < l.length; i++) if (l[i].id === id) {
    c.querySelector('#np_modelo').value = l[i].modelo || '';
    c.querySelector('#np_unit').value = (l[i].preco > 0) ? String(l[i].preco).replace('.', ',') : '';
    npRecalc();
  }
}
function npRecalc() {
  var c = document.getElementById('cont'), t = npNum('np_qtd') * npNum('np_unit');
  c.querySelector('#np_total').value = t ? t.toFixed(2).replace('.', ',') : '';
}
function npConf(i) {
  var el = document.getElementById('npc_' + i);
  var ok = el.className.indexOf(' ok') < 0;
  el.className = 'check-item' + (ok ? ' ok' : '');
  el.firstChild.innerHTML = ok ? '✓' : '';
  var todos = true, k;
  for (k = 0; k < CONF_PEDIDO.length; k++) if (document.getElementById('npc_' + k).className.indexOf(' ok') < 0) todos = false;
  var b = document.getElementById('np_btn');
  b.style.opacity = todos ? '1' : '.5';
  b.innerHTML = todos ? 'Criar pedido' : 'Criar pedido (marque toda a conferência)';
  S.npConfOk = todos;
}
function npAlocarEntrada(valor, cb) {
  if (!valor || valor <= 0) { cb(); return; }
  sbGet('caixa_baldes', 'select=id,saldo,percentual_meta,tipo_balde', function(err, bs) {
    if (err || !bs) { cb(); return; }
    var i = 0;
    function prox() {
      if (i >= bs.length) { cb(); return; }
      var b = bs[i++];
      if (b.tipo_balde === 'teto') { prox(); return; }
      var fatia = Math.round(valor * (b.percentual_meta / 100) * 100) / 100;
      if (!fatia) { prox(); return; }
      var novo = Math.round(((b.saldo || 0) + fatia) * 100) / 100;
      sbPatch('caixa_baldes', 'id=eq.' + b.id, { saldo: novo }, function() { prox(); });
    }
    prox();
  });
}
function npCriar() {
  var c = document.getElementById('cont');
  if (!S.npConfOk) { toast('Marque toda a conferência antes de criar.', true); return; }
  var cliente = (c.querySelector('#np_cliente').value || '').replace(/^\s+|\s+$/g, '');
  var modelo = (c.querySelector('#np_modelo').value || '').replace(/^\s+|\s+$/g, '');
  if (!cliente) { toast('Informe o cliente.', true); return; }
  if (!modelo) { toast('Informe o nome do modelo / peça.', true); return; }
  var catalogo = c.querySelector('#np_orig').value === 'true';
  var pecaId = catalogo ? (c.querySelector('#np_peca').value || null) : null;
  if (catalogo && !pecaId) { toast('Escolha a peça do catálogo.', true); return; }
  var qtd = npNum('np_qtd') || 1, entrada = npNum('np_entrada');
  var obs = (c.querySelector('#np_obs').value || '').replace(/^\s+|\s+$/g, '');
  var aviso = '⚠ Criado no tablet: custos automáticos da ficha pendentes (completar no computador).';
  var id = uuid4();
  var payload = {
    id: id, cliente: cliente, contato: c.querySelector('#np_contato').value || null,
    catalogo: catalogo, peca_propria_id: pecaId, grupo_id: null,
    modelo_nome: modelo, quantidade: qtd,
    valor_unitario: npNum('np_unit'), valor_total: (npNum('np_total') || (qtd * npNum('np_unit'))), valor_entrada: entrada,
    data_entrega: c.querySelector('#np_data').value || null,
    observacoes: obs ? (obs + '\n' + aviso) : aviso,
    prioridade: c.querySelector('#np_prio').value, canal_venda: c.querySelector('#np_canal').value,
    status: 'negociacao', estoque_baixado: false, editado: false,
    ultimo_editor: 'Tablet · ' + (S.colaborador ? S.colaborador.nome.replace(/\s+$/, '') : '')
  };
  var btn = document.getElementById('np_btn'); btn.disabled = true;
  sbPost('pedidos', payload, function(err) {
    if (err) { btn.disabled = false; toast('Erro ao criar pedido: ' + err.message, true); return; }
    npAlocarEntrada(entrada, function() {
      var tipo = null, k;
      for (k in S.tipos) { if (S.tipos[k].codigo === 'contato_cliente') { tipo = S.tipos[k]; break; } }
      function fim(msg) {
        toast(msg, false);
        S.formBuilt = false; S.nav = { mod: 'com', sub: null, lim: 15 };
        carregarPedidosLista(function() { renderModalidades(); });
      }
      if (!tipo) { fim('Pedido criado em Negociação. Tarefa de contato não gerada (tipo não encontrado). Custos pendentes.'); return; }
      sbPost('ordens_trabalho', {
        titulo: 'Contato: ' + cliente, status: 'pendente', tipo_ot_id: tipo.id, subsetor_id: tipo.subsetor_id,
        pedido_id: id, quantidade: 1, ordem_execucao: 0
      }, function(e2) {
        fim(e2 ? 'Pedido criado, mas a tarefa de contato falhou. Custos pendentes (computador).' : 'Pedido criado em Negociação. Custos da ficha pendentes: completar no computador.');
      });
    });
  });
}
