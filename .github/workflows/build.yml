name: Build ValenteOS Samsung APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Fix line endings and permissions
        run: |
          sed -i 's/\r//' gradlew
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="/tmp/app-release-aligned.apk"
          SIGNED="ValenteOS_Samsung_v1.0.apk"
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -v 4 $UNSIGNED $ALIGNED
          keytool -genkeypair -v \
            -keystore /tmp/valente.keystore \
            -alias valente \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass valente2024 \
            -keypass valente2024 \
            -dname "CN=ValenteArtes, O=ValenteArtes, C=BR" 2>/dev/null
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks /tmp/valente.keystore \
            --ks-key-alias valente \
            --ks-pass pass:valente2024 \
            --key-pass pass:valente2024 \
            --out $SIGNED \
            $ALIGNED

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ValenteOS-Samsung-APK
          path: ValenteOS_Samsung_v1.0.apk
          retention-days: 30

